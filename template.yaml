AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BYOL — Spring Boot on Lambda (Strategy A + SnapStart)

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: java21
    Architectures:
      - arm64

Resources:
  SpringBootFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: byol-java-spring-boot
      CodeUri: ./
      Handler: dev.byol.lambda.StreamLambdaHandler::handleRequest
      Tracing: Active
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Events:
        ApiCatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpringBootHttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpringBootHttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: '2.0'
    Metadata:
      BuildMethod: maven

  SpringBootHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  SpringBootLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SpringBootFunction}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${SpringBootHttpApi}.execute-api.${AWS::Region}.amazonaws.com